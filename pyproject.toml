[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analyzer"
version = "0.1.0"
description = "Minimum-variance portfolios on random-matrix-cleaned covariances, with a web page to try them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "PyYAML>=6.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plots = ["matplotlib>=3.8"]
app = ["streamlit>=1.40", "pyarrow>=15.0", "requests>=2.31"]

[project.scripts]
market-analyzer = "market_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
