# Rebuilds the market pack after each US session and publishes it as the
# "pack-latest" release, where the deployed page fetches it (MARKET_PACK_URL).
# The pack committed in data/pack stays as the fallback and is not touched.
name: Refresh market pack

on:
  schedule:
    - cron: "30 2 * * 2-6"   # 02:30 UTC Tuesday to Saturday: after Monday to Friday sessions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet -e ".[app]"
      - name: Build the pack
        run: python examples/build_market_pack.py --out pack --raw raw
      - name: Publish as the pack-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pack-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create pack-latest --repo "$GITHUB_REPOSITORY" --title "Market pack (nightly)" \
                 --notes "Daily returns, per-stock facts and the build report, rebuilt after each US session by the refresh workflow."
          gh release upload pack-latest pack/returns.parquet pack/meta.parquet pack/manifest.json pack/report.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep the report with the run
        uses: actions/upload-artifact@v4
        with:
          name: pack-report
          path: pack/report.txt
